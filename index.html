
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Minha Moldura</title>

<style>
:root {
  /* 🟨 PERSONALIZE AS CORES E FONTES AQUI */

  --imagem-capa: url("foto-capa.jpg");
  --cor-fundo-capa: #ffffff;
  --cor-nomes: #ffffff;
  --fonte-nomes: Georgia, serif;
  --tamanho-nomes: 30px;

  --cor-botao: #ffffff;
  --cor-texto-botao: #333333;
  --cor-fundo-botao: rgba(255,255,255,0.92);
  --fonte-botao: Arial, sans-serif;

  --cor-botoes-camera: #ffffff;
  --cor-legendas-botoes: #ffffff;
  --fonte-legendas: Arial, sans-serif;
  --tamanho-legendas: 10px;

  --cor-suavizacao: #ffffff;
  --cor-fundo-resultado: #ffffff;
  --cor-texto-resultado: #333333;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #000;
}

/* CAPA INICIAL */

#home {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 50px 20px;
  background-color: var(--cor-fundo-capa);
  background-image: var(--imagem-capa);
  background-size: cover;
  background-position: center;
  z-index: 1;
}

#coupleNames {
  color: var(--cor-nomes);
  font-family: var(--fonte-nomes);
  font-size: var(--tamanho-nomes);
  text-align: center;
  margin-bottom: 25px;
}

.main-button {
  border: none;
  border-radius: 30px;
  padding: 15px 30px;
  background: var(--cor-fundo-botao);
  color: var(--cor-texto-botao);
  font-family: var(--fonte-botao);
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
}

/* TELA DA CÂMERA */

#cameraArea {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #000;
  display: none;
  overflow: hidden;
  z-index: 2;
}

#video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  inset: 0;
  transform: none;
}

#frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
  z-index: 3;
}

/* CONTROLE DE SUAVIZAÇÃO */

.smooth-control {
  position: absolute;
  z-index: 5;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  color: var(--cor-suavizacao);
  text-shadow: 0 1px 5px rgba(0,0,0,0.7);
}

.smooth-title {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-size: 10px;
  letter-spacing: 2px;
  font-family: var(--fonte-legendas);
}

.smooth-icon {
  font-size: 19px;
}

#smoothSlider {
  -webkit-appearance: none;
  appearance: none;
  width: 105px;
  height: 3px;
  transform: rotate(-90deg);
  background: rgba(255,255,255,0.7);
  border-radius: 10px;
  outline: none;
  margin: 45px 0;
  cursor: pointer;
}

#smoothSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--cor-suavizacao);
  border: 2px solid rgba(0,0,0,0.25);
}

#smoothSlider::-moz-range-thumb {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--cor-suavizacao);
  border: 2px solid rgba(0,0,0,0.25);
}

#smoothValue {
  font-size: 10px;
  font-family: var(--fonte-legendas);
}

/* BOTÕES DA CÂMERA */

.camera-controls {
  position: absolute;
  bottom: 28px;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 32px;
  z-index: 6;
}

.camera-control {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  border: none;
  background: transparent;
  color: var(--cor-legendas-botoes);
  font-family: var(--fonte-legendas);
  font-size: var(--tamanho-legendas);
  cursor: pointer;
  min-width: 65px;
}

.round-button {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid var(--cor-botoes-camera);
  background: rgba(255,255,255,0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cor-botoes-camera);
  font-size: 20px;
}

.capture-button .round-button {
  width: 66px;
  height: 66px;
  border: 4px solid var(--cor-botoes-camera);
  background: rgba(255,255,255,0.2);
  position: relative;
}

.capture-button .round-button::after {
  content: "";
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  background: var(--cor-botoes-camera);
}

/* TELA DO RESULTADO */

#resultArea {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 15px;
  background: var(--cor-fundo-resultado);
  z-index: 10;
  overflow-y: auto;
}

#photoCanvas {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: calc(100% - 100px);
  object-fit: contain;
}

.result-buttons {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex-wrap: nowrap;
  gap: 7px;
  width: 100%;
  margin-top: 15px;
}

.result-button {
  border: 1px solid rgba(0,0,0,0.15);
  border-radius: 20px;
  padding: 10px 11px;
  background: var(--cor-fundo-botao);
  color: var(--cor-texto-resultado);
  font-family: var(--fonte-botao);
  font-size: 8px;
  letter-spacing: 0.3px;
  white-space: nowrap;
  cursor: pointer;
}

/* MENSAGENS */

#message {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 350px;
  padding: 12px;
  border-radius: 8px;
  background: rgba(0,0,0,0.8);
  color: white;
  font-size: 13px;
  text-align: center;
  display: none;
  z-index: 20;
}

@media (max-width: 360px) {
  .result-buttons {
    gap: 4px;
  }

  .result-button {
    padding: 9px 7px;
    font-size: 7px;
  }

  .camera-controls {
    gap: 20px;
  }
}
</style>
</head>

<body>

<!-- CAPA INICIAL -->

<section id="home">
  <div id="coupleNames">NOME 1 & NOME 2</div>

  <button class="main-button" onclick="openCamera()">
    ACESSAR MOLDURA
  </button>
</section>

<!-- CÂMERA -->

<section id="cameraArea">

  <video id="video" autoplay playsinline muted></video>

  <img
    id="frame"
    src="moldura.png"
    alt="Moldura personalizada"
  >

  <!-- SUAVIZAÇÃO VISÍVEL DESDE A ABERTURA DA CÂMERA -->

  <div class="smooth-control">
    <span class="smooth-title">SUAVIZAR PELE</span>
    <span class="smooth-icon">✧</span>

    <input
      type="range"
      id="smoothSlider"
      min="0"
      max="100"
      step="5"
      value="0"
      aria-label="Suavizar pele"
    >

    <span id="smoothValue">0%</span>
  </div>

  <!-- CONTROLES INFERIORES -->

  <div class="camera-controls">

    <button class="camera-control" onclick="openGallery()">
      <span class="round-button">▧</span>
      <span>GALERIA</span>
    </button>

    <button class="camera-control capture-button" onclick="takePhoto()">
      <span class="round-button"></span>
      <span>FOTOGRAFAR</span>
    </button>

    <button class="camera-control" onclick="switchCamera()">
      <span class="round-button">↻</span>
      <span>TROCAR CÂMERA</span>
    </button>

  </div>

  <input
    type="file"
    id="galleryInput"
    accept="image/*"
    hidden
  >

</section>

<!-- RESULTADO -->

<section id="resultArea">

  <canvas id="photoCanvas" width="1080" height="1920"></canvas>

  <div class="result-buttons">

    <button class="result-button" onclick="savePhoto()">
      SALVAR MINHA FOTO
    </button>

    <button class="result-button" onclick="goHome()">
      VOLTAR AO INÍCIO
    </button>

    <button class="result-button" onclick="takeAnotherPhoto()">
      TIRAR OUTRA FOTO
    </button>

  </div>

</section>

<div id="message"></div>

<script>
const home = document.getElementById("home");
const cameraArea = document.getElementById("cameraArea");
const resultArea = document.getElementById("resultArea");
const video = document.getElementById("video");
const frame = document.getElementById("frame");
const canvas = document.getElementById("photoCanvas");
const ctx = canvas.getContext("2d");
const galleryInput = document.getElementById("galleryInput");

const smoothSlider = document.getElementById("smoothSlider");
const smoothValue = document.getElementById("smoothValue");

let stream = null;
let facingMode = "environment";
let currentPhoto = null;
let galleryObjectUrl = null;

/* MENSAGENS */

function showMessage(text) {
  const message = document.getElementById("message");
  message.textContent = text;
  message.style.display = "block";

  setTimeout(() => {
    message.style.display = "none";
  }, 4500);
}

/* SUAVIZAÇÃO */

function getSmoothBlur() {
  return Number(smoothSlider.value) * 0.025;
}

function updateSmoothness() {
  const value = Number(smoothSlider.value);

  smoothValue.textContent = value + "%";

  video.style.filter = value > 0
    ? `blur(${getSmoothBlur()}px)`
    : "none";
}

smoothSlider.addEventListener("input", updateSmoothness);

/* ABRIR CÂMERA */

async function openCamera() {
  stopCamera();

  home.style.display = "none";
  resultArea.style.display = "none";
  cameraArea.style.display = "block";

  updateSmoothness();

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showMessage("Seu navegador não permite acessar a câmera. Abra esta página em um navegador atualizado e use HTTPS.");
    return;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1080 },
        height: { ideal: 1920 }
      }
    });

    video.srcObject = stream;

    await new Promise((resolve, reject) => {
      if (video.readyState >= 1) {
        resolve();
      } else {
        video.onloadedmetadata = resolve;
        video.onerror = reject;
      }
    });

    await video.play();

  } catch (error) {
    console.error(error);

    cameraArea.style.display = "none";
    home.style.display = "flex";

    if (error.name === "NotAllowedError" || error.name === "PermissionDeniedError") {
      showMessage("Permita o acesso à câmera nas configurações do navegador.");
    } else if (error.name === "NotReadableError") {
      showMessage("A câmera está sendo usada por outro aplicativo. Feche outros aplicativos que estejam usando a câmera e tente novamente.");
    } else {
      showMessage("Não foi possível abrir a câmera. Verifique as permissões e tente novamente.");
    }
  }
}

/* ENCERRAR CÂMERA */

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.pause();
  video.srcObject = null;
}

/* TROCAR CÂMERA */

async function switchCamera() {
  facingMode = facingMode === "environment" ? "user" : "environment";
  await openCamera();
}

/* CAPTURAR IMAGEM */

function takePhoto() {
  if (!video.srcObject || video.readyState < 2) {
    showMessage("Aguarde a câmera carregar.");
    return;
  }

  drawCover(video);
}

/* ABRIR GALERIA */

function openGallery() {
  galleryInput.click();
}

galleryInput.addEventListener("change", function(event) {
  const file = event.target.files[0];

  if (!file) return;

  if (galleryObjectUrl) {
    URL.revokeObjectURL(galleryObjectUrl);
  }

  galleryObjectUrl = URL.createObjectURL(file);

  const image = new Image();

  image.onload = function() {
    drawCover(image);
    URL.revokeObjectURL(galleryObjectUrl);
    galleryObjectUrl = null;
    galleryInput.value = "";
  };

  image.onerror = function() {
    showMessage("Não foi possível abrir essa imagem.");
    URL.revokeObjectURL(galleryObjectUrl);
    galleryObjectUrl = null;
    galleryInput.value = "";
  };

  image.src = galleryObjectUrl;
});

/* AJUSTAR IMAGEM PARA 9:16 */

function drawCover(source) {
  const sourceWidth = source.videoWidth || source.naturalWidth;
  const sourceHeight = source.videoHeight || source.naturalHeight;

  if (!sourceWidth || !sourceHeight) {
    showMessage("Não foi possível carregar a imagem.");
    return;
  }

  const targetRatio = 1080 / 1920;
  const sourceRatio = sourceWidth / sourceHeight;

  let sx = 0;
  let sy = 0;
  let sw = sourceWidth;
  let sh = sourceHeight;

  if (sourceRatio > targetRatio) {
    sw = sourceHeight * targetRatio;
    sx = (sourceWidth - sw) / 2;
  } else {
    sh = sourceWidth / targetRatio;
    sy = (sourceHeight - sh) / 2;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const blur = getSmoothBlur();

  ctx.save();
  ctx.filter = blur > 0 ? `blur(${blur}px)` : "none";

  ctx.drawImage(
    source,
    sx, sy, sw, sh,
    0, 0, canvas.width, canvas.height
  );

  ctx.restore();

  applyFrame();

  currentPhoto = canvas.toDataURL("image/png");

  stopCamera();

  cameraArea.style.display = "none";
  resultArea.style.display = "flex";
}

/* APLICAR MOLDURA */

function applyFrame() {
  if (frame.complete && frame.naturalWidth > 0) {
    ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
  } else {
    frame.onload = function() {
      ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
      currentPhoto = canvas.toDataURL("image/png");
    };
  }
}

/* SALVAR FOTO */

function savePhoto() {
  if (!currentPhoto) {
    showMessage("Nenhuma foto disponível para salvar.");
    return;
  }

  const link = document.createElement("a");
  link.href = currentPhoto;
  link.download = "minha-foto-com-moldura.png";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

/* VOLTAR AO INÍCIO */

function goHome() {
  stopCamera();

  currentPhoto = null;
  resultArea.style.display = "none";
  cameraArea.style.display = "none";
  home.style.display = "flex";
}

/* TIRAR OUTRA FOTO */

function takeAnotherPhoto() {
  currentPhoto = null;
  openCamera();
}

/* LIMPEZA */

window.addEventListener("pagehide", stopCamera);

</script>

</body>
</html>
