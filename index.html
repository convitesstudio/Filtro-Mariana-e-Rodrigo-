
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Cabine de Fotos</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

:root {
  /* 🟨 CORES DOS BOTÕES DA CÂMERA */
  --camera-button-color: #ffffff;
  --camera-label-color: #ffffff;
  --camera-button-background: rgba(255,255,255,0.18);

  /* 🟨 CORES DOS BOTÕES DE RESULTADO */
  --result-button-background: #ffffff;
  --result-button-text: #333333;
  --result-button-border: #dddddd;

  /* 🟨 CORES DO FUNDO */
  --result-background: #ffffff;

  /* 🟨 TAMANHO DAS LEGENDAS */
  --camera-label-size: 10px;

  /* 🟨 FONTE DOS BOTÕES */
  --button-font: Arial, sans-serif;
}

#cameraArea {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

#video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
  z-index: 3;
}

/* CONTROLES DA CÂMERA */

.camera-controls {
  position: absolute;
  bottom: 28px;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 32px;
  z-index: 6;
}

.camera-control {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  border: none;
  background: transparent;
  color: var(--camera-label-color);
  font-family: var(--button-font);
  font-size: var(--camera-label-size);
  cursor: pointer;
  min-width: 65px;
}

.round-button {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid var(--camera-button-color);
  background: var(--camera-button-background);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--camera-button-color);
  font-size: 20px;
}

.capture-button .round-button {
  width: 66px;
  height: 66px;
  border: 4px solid var(--camera-button-color);
  background: var(--camera-button-background);
  position: relative;
}

.capture-button .round-button::after {
  content: "";
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  background: var(--camera-button-color);
}

/* RESULTADO */

#resultArea {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 15px;
  background: var(--result-background);
  z-index: 10;
  overflow-y: auto;
}

#photoCanvas {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: calc(100% - 100px);
  object-fit: contain;
}

/* BOTÕES DE RESULTADO */

.result-buttons {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex-wrap: nowrap;
  gap: 7px;
  width: 100%;
  margin-top: 15px;
}

.result-button {
  border: 1px solid var(--result-button-border);
  border-radius: 20px;
  padding: 10px 11px;
  background: var(--result-button-background);
  color: var(--result-button-text);
  font-family: var(--button-font);
  font-size: 8px;
  letter-spacing: 0.3px;
  white-space: nowrap;
  cursor: pointer;
}

/* MENSAGEM */

#message {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 350px;
  padding: 12px;
  border-radius: 8px;
  background: rgba(0,0,0,0.85);
  color: white;
  font-size: 13px;
  text-align: center;
  display: none;
  z-index: 20;
}

@media (max-width: 360px) {
  .result-buttons {
    gap: 4px;
  }

  .result-button {
    padding: 9px 7px;
    font-size: 7px;
  }

  .camera-controls {
    gap: 20px;
  }
}
</style>
</head>

<body>

<section id="cameraArea">

  <video id="video" autoplay playsinline muted></video>

  <!-- 🟨 ARQUIVO DA MOLDURA -->
  <img id="frame" src="moldura.png" alt="Moldura personalizada">

  <div class="camera-controls">

    <button class="camera-control" onclick="openGallery()">
      <span class="round-button">▧</span>
      <span id="galleryLabel">GALERIA</span>
    </button>

    <button class="camera-control capture-button"
      onclick="takePhoto()">
      <span class="round-button"></span>
      <span id="photoLabel">FOTOGRAFAR</span>
    </button>

    <button class="camera-control" onclick="switchCamera()">
      <span class="round-button">↻</span>
      <span id="switchLabel">TROCAR CÂMERA</span>
    </button>

  </div>

  <input type="file"
    id="galleryInput"
    accept="image/*"
    hidden>

</section>

<section id="resultArea">

  <canvas id="photoCanvas"
    width="1080"
    height="1920">
  </canvas>

  <div class="result-buttons">

    <button class="result-button"
      onclick="savePhoto()"
      id="saveButton">
      SALVAR MINHA FOTO
    </button>

    <button class="result-button"
      onclick="backToCamera()"
      id="homeButton">
      VOLTAR AO INÍCIO
    </button>

    <button class="result-button"
      onclick="takeAgain()"
      id="againButton">
      TIRAR OUTRA FOTO
    </button>

  </div>

</section>

<div id="message"></div>

<script>

/* ==========================================
   🟨 ÁREA DE PERSONALIZAÇÃO
========================================== */

const CONFIG = {

  // 🟨 NOME DO EVENTO
  eventName: "Cabine de Fotos",

  // 🟨 ARQUIVO DA MOLDURA
  frameFile: "moldura.png",

  // 🟨 NOME DA FOTO SALVA
  photoFileName: "minha-foto-com-moldura.png",

  // 🟨 TEXTOS DOS BOTÕES
  galleryLabel: "GALERIA",
  photoLabel: "FOTOGRAFAR",
  switchCameraLabel: "TROCAR CÂMERA",

  // 🟨 TEXTOS DO RESULTADO
  saveLabel: "SALVAR MINHA FOTO",
  homeLabel: "VOLTAR AO INÍCIO",
  againLabel: "TIRAR OUTRA FOTO",

  // 🟨 CÂMERA INICIAL
  // environment = traseira
  // user = frontal
  initialCamera: "environment",

  // 🟨 QUALIDADE DA FOTO
  photoWidth: 1080,
  photoHeight: 1920

};

/* FIM DA PERSONALIZAÇÃO */

/* ELEMENTOS */

const cameraArea = document.getElementById("cameraArea");
const resultArea = document.getElementById("resultArea");

const video = document.getElementById("video");
const frame = document.getElementById("frame");

const canvas = document.getElementById("photoCanvas");
const ctx = canvas.getContext("2d");

const galleryInput = document.getElementById("galleryInput");

let stream = null;
let facingMode = CONFIG.initialCamera;
let currentPhoto = null;

/* PERSONALIZAÇÃO */

document.title = CONFIG.eventName;
frame.src = CONFIG.frameFile;

document.getElementById("galleryLabel").textContent =
  CONFIG.galleryLabel;

document.getElementById("photoLabel").textContent =
  CONFIG.photoLabel;

document.getElementById("switchLabel").textContent =
  CONFIG.switchCameraLabel;

document.getElementById("saveButton").textContent =
  CONFIG.saveLabel;

document.getElementById("homeButton").textContent =
  CONFIG.homeLabel;

document.getElementById("againButton").textContent =
  CONFIG.againLabel;

/* MENSAGENS */

function showMessage(text) {

  const message = document.getElementById("message");

  message.textContent = text;
  message.style.display = "block";

  setTimeout(() => {
    message.style.display = "none";
  }, 4500);
}

/* DESENHAR IMAGEM NO FORMATO 9:16 */

function drawCover(source, targetContext) {

  const sourceWidth =
    source.videoWidth || source.naturalWidth;

  const sourceHeight =
    source.videoHeight || source.naturalHeight;

  if (!sourceWidth || !sourceHeight) return;

  const targetWidth = CONFIG.photoWidth;
  const targetHeight = CONFIG.photoHeight;

  const targetRatio = targetWidth / targetHeight;
  const sourceRatio = sourceWidth / sourceHeight;

  targetContext.clearRect(
    0, 0, targetWidth, targetHeight
  );

  /*
    🟨 AJUSTE DA SELFIE:
    Na câmera frontal, mostra a imagem inteira,
    sem ampliar e sem cortar o rosto.
  */

  if (source === video && facingMode === "user") {

    const scale = Math.min(
      targetWidth / sourceWidth,
      targetHeight / sourceHeight
    );

    const width = sourceWidth * scale;
    const height = sourceHeight * scale;

    const x = (targetWidth - width) / 2;
    const y = (targetHeight - height) / 2;

    targetContext.fillStyle = "#000000";

    targetContext.fillRect(
      0, 0, targetWidth, targetHeight
    );

    targetContext.drawImage(
      source,
      x, y, width, height
    );

  } else {

    /* MANTÉM O ENQUADRAMENTO DA CÂMERA TRASEIRA */

    let sx = 0;
    let sy = 0;
    let sw = sourceWidth;
    let sh = sourceHeight;

    if (sourceRatio > targetRatio) {

      sw = sourceHeight * targetRatio;
      sx = (sourceWidth - sw) / 2;

    } else {

      sh = sourceWidth / targetRatio;
      sy = (sourceHeight - sh) / 2;

    }

    targetContext.drawImage(
      source,
      sx, sy, sw, sh,
      0, 0, targetWidth, targetHeight
    );
  }

  /* APLICA A MOLDURA */

  if (frame.complete && frame.naturalWidth) {

    targetContext.drawImage(
      frame,
      0, 0, targetWidth, targetHeight
    );

  }
}

/* ABRIR CÂMERA */

async function openCamera() {

  stopCamera();

  resultArea.style.display = "none";
  cameraArea.style.display = "block";

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    showMessage(
      "Seu navegador não permite acessar a câmera. Use uma conexão HTTPS."
    );

    return;
  }

  try {

    stream = await navigator.mediaDevices.getUserMedia({

      audio: false,

      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: CONFIG.photoWidth },
        height: { ideal: CONFIG.photoHeight }
      }

    });

    video.srcObject = stream;

    await new Promise((resolve, reject) => {

      if (video.readyState >= 1) {
        resolve();
      } else {
        video.onloadedmetadata = resolve;
        video.onerror = reject;
      }

    });

    /*
      🟨 AJUSTE DA PRÉVIA DA SELFIE:
      Câmera frontal = contain.
      Câmera traseira = cover.
    */

    if (facingMode === "user") {
      video.style.objectFit = "contain";
    } else {
      video.style.objectFit = "cover";
    }

    await video.play();

  } catch (error) {

    console.error(error);

    if (error.name === "NotAllowedError" ||
        error.name === "PermissionDeniedError") {

      showMessage(
        "Permita o acesso à câmera nas configurações do navegador."
      );

    } else if (error.name === "NotReadableError") {

      showMessage(
        "A câmera está sendo usada por outro aplicativo."
      );

    } else {

      showMessage(
        "Não foi possível abrir a câmera. Verifique as permissões e tente novamente."
      );

    }
  }
}

/* ENCERRAR CÂMERA */

function stopCamera() {

  if (stream) {

    stream.getTracks().forEach(track => track.stop());
    stream = null;

  }

  video.pause();
  video.srcObject = null;
}

/* TROCAR CÂMERA */

async function switchCamera() {

  facingMode =
    facingMode === "environment"
      ? "user"
      : "environment";

  await openCamera();
}

/* FOTOGRAFAR */

function takePhoto() {

  if (!video.srcObject || video.readyState < 2) {

    showMessage("Aguarde a câmera carregar.");
    return;

  }

  if (!frame.complete || !frame.naturalWidth) {

    showMessage("Aguarde a moldura carregar.");
    return;

  }

  drawCover(video, ctx);

  currentPhoto = canvas.toDataURL("image/png");

  showPhotoResult();
}

/* RESULTADO DA FOTO */

function showPhotoResult() {

  stopCamera();

  cameraArea.style.display = "none";
  resultArea.style.display = "flex";

}

/* GALERIA */

function openGallery() {

  galleryInput.click();

}

galleryInput.addEventListener("change", function(event) {

  const file = event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {

    showMessage("Selecione uma foto.");
    galleryInput.value = "";
    return;

  }

  const objectUrl = URL.createObjectURL(file);
  const image = new Image();

  image.onload = function() {

    drawCover(image, ctx);

    currentPhoto = canvas.toDataURL("image/png");

    URL.revokeObjectURL(objectUrl);

    galleryInput.value = "";

    showPhotoResult();

  };

  image.onerror = function() {

    showMessage("Não foi possível abrir essa imagem.");

    URL.revokeObjectURL(objectUrl);
    galleryInput.value = "";

  };

  image.src = objectUrl;

});

/* SALVAR FOTO */

function savePhoto() {

  if (!currentPhoto) {

    showMessage("Nenhuma foto disponível para salvar.");
    return;

  }

  const link = document.createElement("a");

  link.href = currentPhoto;
  link.download = CONFIG.photoFileName;

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

}

/* VOLTAR À CÂMERA */

function backToCamera() {

  currentPhoto = null;

  openCamera();

}

/* TIRAR OUTRA FOTO */

function takeAgain() {

  backToCamera();

}

/* INICIAR DIRETAMENTE NA CÂMERA */

openCamera();

</script>

</body>
</html>
