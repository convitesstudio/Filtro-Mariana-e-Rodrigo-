<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#211c19">

<title>Mariana & Rodrigo</title>

<style>

/* =================================
   PERSONALIZE AS CORES AQUI
================================= */

:root {
  --cor-nomes: #ffffff;
  --cor-botao: #ffffff;
  --cor-texto-botao: #333333;
  --cor-fundo-botao: rgba(255,255,255,0.20);
  --cor-botoes-camera: rgba(255,255,255,0.25);
  --cor-fundo-resultado: #f5eee8;
  --cor-texto-resultado: #51443c;
}

/* CONFIGURAÇÕES GERAIS */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #171412;
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  margin: auto;
  overflow: hidden;
}

/* =================================
   CAPA CENTRALIZADA
================================= */

#home {
  width: 100%;
  height: 100vh;
  height: 100svh;
  min-height: 550px;
}

.hero {
  height: 100%;
  width: 100%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
}

.hero-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(20,15,12,0.10),
    rgba(20,15,12,0.35)
  );
}

.hero-content {
  position: relative;
  z-index: 2;
  width: 100%;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.names {
  font-family: Georgia, serif;
  font-size: clamp(40px, 11vw, 52px);
  font-weight: normal;
  line-height: 1.1;
  color: var(--cor-nomes);
}

.names span {
  display: block;
  font-size: 25px;
  font-style: italic;
  margin: 6px 0;
}

.access-button {
  margin-top: 35px;
  padding: 17px 38px;
  border: 1px solid var(--cor-botao);
  border-radius: 50px;
  background: var(--cor-fundo-botao);
  color: var(--cor-botao);
  font-size: 11px;
  letter-spacing: 2px;
  backdrop-filter: blur(8px);
  cursor: pointer;
}

/* =================================
   CÂMERA E MOLDURA 9:16
================================= */

#cameraArea {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #000;
}

.stage {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
}

/* =================================
   BOTÕES REDONDOS DA CÂMERA
================================= */

.camera-controls {
  position: absolute;
  z-index: 25;
  bottom: max(35px, env(safe-area-inset-bottom));
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  padding: 0 20px;
}

.round-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.85);
  background: var(--cor-botoes-camera);
  color: white;
  font-size: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  cursor: pointer;
}

.round-btn.shutter {
  width: 78px;
  height: 78px;
  border: 5px solid rgba(255,255,255,0.45);
  background: white;
  color: #333;
  font-size: 27px;
}

/* =================================
   RESULTADO
================================= */

#resultArea {
  display: none;
  position: relative;
  z-index: 30;
  min-height: 100vh;
  padding: 25px 18px;
  background: var(--cor-fundo-resultado);
  color: var(--cor-texto-resultado);
  text-align: center;
}

.result-title {
  font-family: Georgia, serif;
  font-size: 27px;
  font-weight: normal;
  margin-top: 20px;
}

.result-description {
  font-size: 13px;
  margin-top: 8px;
  color: #76675d;
}

#resultCanvas {
  display: block;
  width: 100%;
  height: auto;
  margin: 20px 0;
}

.result-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.result-button {
  width: 100%;
  padding: 17px;
  border: 1px solid #c7b8a9;
  border-radius: 40px;
  background: transparent;
  color: var(--cor-texto-resultado);
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
}

.result-button.primary {
  background: var(--cor-texto-resultado);
  color: white;
}

/* GALERIA */

#gallery {
  display: none;
}

</style>
</head>

<body>

<div class="app">

<!-- CAPA -->

<section id="home">

  <div class="hero">

    <img
      src="foto-capa.jpg"
      class="hero-bg"
      alt="Mariana e Rodrigo"
    >

    <div class="overlay"></div>

    <div class="hero-content">

      <h1 class="names">
        Mariana
        <span>&</span>
        Rodrigo
      </h1>

      <button
        class="access-button"
        onclick="openCamera()"
      >
        ACESSAR MOLDURA
      </button>

    </div>

  </div>

</section>

<!-- CÂMERA -->

<section id="cameraArea">

  <div class="stage">

    <video
      id="video"
      autoplay
      playsinline
    ></video>

    <img
      id="frame"
      src="moldura.png"
      alt="Moldura personalizada"
    >

  </div>

  <div class="camera-controls">

    <button
      class="round-btn"
      onclick="openGallery()"
      aria-label="Escolher foto da galeria"
    >
      ▧
    </button>

    <button
      class="round-btn shutter"
      onclick="takePhoto()"
      aria-label="Tirar foto"
    >
      ●
    </button>

    <button
      class="round-btn"
      onclick="switchCamera()"
      aria-label="Trocar câmera"
    >
      ↻
    </button>

  </div>

</section>

<input
  type="file"
  id="gallery"
  accept="image/*"
>

<!-- RESULTADO -->

<section id="resultArea">

  <h2 class="result-title">
    Sua lembrança está pronta!
  </h2>

  <p class="result-description">
    Salve sua fotografia especial.
  </p>

  <canvas id="resultCanvas"></canvas>

  <div class="result-buttons">

    <button
      class="result-button primary"
      onclick="downloadPhoto()"
    >
      SALVAR MINHA FOTO
    </button>

    <button
      class="result-button"
      onclick="goHome()"
    >
      VOLTAR AO INÍCIO
    </button>

    <button
      class="result-button"
      onclick="openCamera()"
    >
      TIRAR OUTRA FOTO
    </button>

  </div>

</section>

</div>

<script>

/* ELEMENTOS */

const video = document.getElementById("video");
const canvas = document.getElementById("resultCanvas");
const ctx = canvas.getContext("2d");

const home = document.getElementById("home");
const cameraArea = document.getElementById("cameraArea");
const resultArea = document.getElementById("resultArea");

let stream = null;
let facingMode = "user";

/* NAVEGAÇÃO */

function showSection(section) {
  home.style.display = "none";
  cameraArea.style.display = "none";
  resultArea.style.display = "none";

  section.style.display = "block";
  window.scrollTo(0, 0);
}

/* ENCERRAR CÂMERA */

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
}

/* ABRIR CÂMERA */

async function openCamera() {
  try {
    stopCamera();

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Câmera indisponível");
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: facingMode
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    showSection(cameraArea);

  } catch (error) {
    stopCamera();

    alert(
      "Não foi possível abrir a câmera. Verifique as permissões do navegador."
    );
  }
}

/* TROCAR CÂMERA */

async function switchCamera() {
  facingMode =
    facingMode === "user" ? "environment" : "user";

  await openCamera();
}

/* ABRIR GALERIA */

function openGallery() {
  document.getElementById("gallery").click();
}

/* AJUSTAR FOTO PARA 9:16 */

function drawCover(source) {
  const sw = source.videoWidth || source.naturalWidth;
  const sh = source.videoHeight || source.naturalHeight;

  const width = 1080;
  const height = 1920;

  const scale = Math.max(width / sw, height / sh);

  const cropWidth = width / scale;
  const cropHeight = height / scale;

  const sx = (sw - cropWidth) / 2;
  const sy = (sh - cropHeight) / 2;

  ctx.drawImage(
    source,
    sx,
    sy,
    cropWidth,
    cropHeight,
    0,
    0,
    width,
    height
  );
}

/* APLICAR MOLDURA */

function applyFrame(source, cleanup) {
  const frameImage = new Image();

  frameImage.onload = function() {
    canvas.width = 1080;
    canvas.height = 1920;

    drawCover(source);

    ctx.drawImage(
      frameImage,
      0,
      0,
      1080,
      1920
    );

    if (cleanup) cleanup();

    stopCamera();
    showSection(resultArea);
  };

  frameImage.onerror = function() {
    if (cleanup) cleanup();

    alert(
      "Não foi possível carregar moldura.png. Confira se o arquivo está no GitHub."
    );
  };

  frameImage.src = "moldura.png";
}

/* TIRAR FOTO */

function takePhoto() {
  if (!video.videoWidth) {
    alert("Aguarde a câmera iniciar.");
    return;
  }

  applyFrame(video);
}

/* ESCOLHER FOTO DA GALERIA */

document.getElementById("gallery").addEventListener(
  "change",
  function(event) {
    const file = event.target.files[0];

    if (!file) return;

    const image = new Image();
    const imageURL = URL.createObjectURL(file);

    image.onload = function() {
      applyFrame(image, function() {
        URL.revokeObjectURL(imageURL);
      });
    };

    image.onerror = function() {
      URL.revokeObjectURL(imageURL);
      alert("Não foi possível abrir essa fotografia.");
    };

    image.src = imageURL;
    event.target.value = "";
  }
);

/* BAIXAR FOTO */

function downloadPhoto() {
  canvas.toBlob(function(blob) {
    if (!blob) {
      alert("Não foi possível gerar a foto.");
      return;
    }

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "lembranca-mariana-e-rodrigo.png";

    link.click();

    setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 1000);

  }, "image/png");
}

/* VOLTAR À CAPA */

function goHome() {
  stopCamera();
  showSection(home);
}

</script>

</body>
</html>
