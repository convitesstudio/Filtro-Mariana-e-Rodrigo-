
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#211c19">

<title>Mariana & Rodrigo</title>

<!-- FONTES DISPONÍVEIS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* ==================================================
   🟨🟨🟨 PERSONALIZE AQUI PARA CADA CASAMENTO 🟨🟨🟨
================================================== */

:root {

  /* 🟨 FOTO DE FUNDO DA CAPA
     Troque foto-capa.jpg pelo nome da nova imagem.
     Para usar somente uma cor, coloque: none
  */
  --imagem-capa: url("foto-capa.jpg");

  /* 🟨 COR DE FUNDO DA CAPA */
  --cor-fundo-capa: #808000;

  /* 🟨 COR DOS NOMES DA CAPA */
  --cor-nomes: #FFFFFF;

  /* 🟨 FONTE DOS NOMES DA CAPA */
  --fonte-nomes: 'Cinzel', serif;

  /* 🟨 TAMANHO DOS NOMES DA CAPA */
  --tamanho-nomes: 54px;

  /* 🟨 COR DA BORDA DO BOTÃO */
  --cor-botao: #ffffff;

  /* 🟨 COR DA ESCRITA DO BOTÃO */
  --cor-texto-botao: #333333;

  /* 🟨 COR DE FUNDO DO BOTÃO */
  --cor-fundo-botao: rgba(255,255,255,0.85);

  /* 🟨 FONTE DO BOTÃO */
  --fonte-botao: 'Montserrat', sans-serif;

  /* 🟨 COR DOS NOMES NA CÂMERA */
  --cor-nomes-camera: #ffffff;

  /* 🟨 FONTE DOS NOMES NA CÂMERA */
  --fonte-camera: 'Cinzel', serif;

  /* 🟨 TAMANHO DOS NOMES NA CÂMERA */
  --tamanho-camera: 30px;

  /* 🟨 COR DOS BOTÕES REDONDOS */
  --cor-botoes-camera: rgba(255,255,255,0.25);

  /* 🟨 CORES DA TELA DE RESULTADO */
  --cor-fundo-resultado: #f5eee8;
  --cor-texto-resultado: #51443c;

}

/* CONFIGURAÇÕES GERAIS */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #171412;
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  margin: auto;
  overflow: hidden;
}

/* ==================================================
   CAPA
================================================== */

#home {
  width: 100%;
  height: 100vh;
  height: 100svh;
  min-height: 550px;
}

.hero {
  height: 100%;
  width: 100%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  background-color: var(--cor-fundo-capa);
}

.hero-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-image: var(--imagem-capa);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(20,15,12,0.10),
    rgba(20,15,12,0.35)
  );
}

.hero-content {
  position: relative;
  z-index: 2;
  width: 100%;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.names {
  font-family: var(--fonte-nomes);
  font-size: var(--tamanho-nomes);
  font-weight: normal;
  line-height: 1.1;
  color: var(--cor-nomes);
}

.names span {
  display: block;
  font-size: 25px;
  font-style: italic;
  margin: 6px 0;
}

.access-button {
  margin-top: 35px;
  padding: 17px 38px;
  border: 1px solid var(--cor-botao);
  border-radius: 50px;
  background: var(--cor-fundo-botao);
  color: var(--cor-texto-botao);
  font-family: var(--fonte-botao);
  font-size: 11px;
  letter-spacing: 2px;
  backdrop-filter: blur(8px);
  cursor: pointer;
}

/* ==================================================
   CÂMERA EM TELA CHEIA
================================================== */

#cameraArea {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #000;
}

.stage {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 🟨 MOLDURA DO CASAMENTO */
#frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
}

/* ==================================================
   🟨 POSIÇÃO DOS NOMES NA MOLDURA
   Aumente bottom para subir os nomes.
   Diminua bottom para descer os nomes.
================================================== */

.camera-names {
  position: absolute;
  z-index: 24;
  left: 0;
  right: 0;
  bottom: 145px;
  width: 100%;
  text-align: center;
  padding: 0 15px;

  color: var(--cor-nomes-camera);
  font-family: var(--fonte-camera);
  font-size: var(--tamanho-camera);
  font-weight: normal;
  line-height: 1.2;

  text-shadow: 0 1px 5px rgba(0,0,0,0.35);
  pointer-events: none;
}

/* ==================================================
   BOTÕES REDONDOS DA CÂMERA
================================================== */

.camera-controls {
  position: absolute;
  z-index: 25;
  bottom: max(35px, env(safe-area-inset-bottom));
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  padding: 0 20px;
}

.round-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.85);
  background: var(--cor-botoes-camera);
  color: white;
  font-size: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  cursor: pointer;
}

.round-btn.shutter {
  width: 78px;
  height: 78px;
  border: 5px solid rgba(255,255,255,0.45);
  background: white;
  color: #333;
  font-size: 27px;
}

/* ==================================================
   RESULTADO
================================================== */

#resultArea {
  display: none;
  position: relative;
  z-index: 30;
  min-height: 100vh;
  padding: 25px 18px;
  background: var(--cor-fundo-resultado);
  color: var(--cor-texto-resultado);
  text-align: center;
}

.result-title {
  font-family: var(--fonte-nomes);
  font-size: 27px;
  font-weight: normal;
  margin-top: 20px;
}

.result-description {
  font-size: 13px;
  margin-top: 8px;
  color: #76675d;
}

#resultCanvas {
  display: block;
  width: 100%;
  height: auto;
  margin: 20px 0;
}

.result-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.result-button {
  width: 100%;
  padding: 17px;
  border: 1px solid #c7b8a9;
  border-radius: 40px;
  background: transparent;
  color: var(--cor-texto-resultado);
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
}

.result-button.primary {
  background: var(--cor-texto-resultado);
  color: white;
}

#gallery {
  display: none;
}

</style>
</head>

<body>

<div class="app">

<!-- ==================================================
     CAPA
     🟨 ALTERE OS NOMES ABAIXO
================================================== -->

<section id="home">

  <div class="hero">

    <div class="hero-bg"></div>
    <div class="overlay"></div>

    <div class="hero-content">

      <h1 class="names">
        <!-- 🟨 NOME DO PRIMEIRO NOIVO -->
        Mariana

        <span>&</span>

        <!-- 🟨 NOME DO SEGUNDO NOIVO -->
        Rodrigo
      </h1>

      <!-- 🟨 ALTERE O TEXTO DO BOTÃO AQUI -->
      <button class="access-button" onclick="openCamera()">
        ACESSAR MOLDURA
      </button>

    </div>

  </div>

</section>

<!-- ==================================================
     CÂMERA
================================================== -->

<section id="cameraArea">

  <div class="stage">

    <video id="video" autoplay playsinline></video>

    <!-- 🟨 ARQUIVO DA MOLDURA -->
    <img id="frame" src="moldura.png" alt="Moldura personalizada">

  </div>

  <!-- 🟨 ALTERE AQUI OS NOMES QUE APARECEM NA MOLDURA -->

  <div class="camera-names" id="cameraNames">
    Mariana & Rodrigo
  </div>

  <!-- BOTÕES DA CÂMERA -->

  <div class="camera-controls">

    <button class="round-btn" onclick="openGallery()" aria-label="Abrir galeria">
      ▧
    </button>

    <button class="round-btn shutter" onclick="takePhoto()" aria-label="Tirar foto">
      ●
    </button>

    <button class="round-btn" onclick="switchCamera()" aria-label="Trocar câmera">
      ↻
    </button>

  </div>

</section>

<input type="file" id="gallery" accept="image/*">

<!-- ==================================================
     RESULTADO
================================================== -->

<section id="resultArea">

  <h2 class="result-title">
    Sua lembrança está pronta!
  </h2>

  <p class="result-description">
    Salve sua fotografia especial.
  </p>

  <canvas id="resultCanvas"></canvas>

  <div class="result-buttons">

    <button class="result-button primary" onclick="downloadPhoto()">
      SALVAR MINHA FOTO
    </button>

    <button class="result-button" onclick="goHome()">
      VOLTAR AO INÍCIO
    </button>

    <button class="result-button" onclick="openCamera()">
      TIRAR OUTRA FOTO
    </button>

  </div>

</section>

</div>

<script>

/* ELEMENTOS */

const video = document.getElementById("video");
const canvas = document.getElementById("resultCanvas");
const ctx = canvas.getContext("2d");

const home = document.getElementById("home");
const cameraArea = document.getElementById("cameraArea");
const resultArea = document.getElementById("resultArea");

let stream = null;
let facingMode = "environment";

/* NAVEGAÇÃO */

function showSection(section) {
  home.style.display = "none";
  cameraArea.style.display = "none";
  resultArea.style.display = "none";

  section.style.display = "block";
  window.scrollTo(0, 0);
}

/* ENCERRAR CÂMERA */

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
}

/* ABRIR CÂMERA TRASEIRA */

async function openCamera() {
  try {
    stopCamera();

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Câmera indisponível");
    }

    let newStream;

    try {
      newStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { exact: "environment" }
        },
        audio: false
      });

    } catch (error) {
      if (
        error.name === "OverconstrainedError" ||
        error.name === "NotFoundError" ||
        error.name === "TypeError"
      ) {
        newStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });
      } else {
        throw error;
      }
    }

    stream = newStream;
    video.srcObject = stream;

    await video.play();

    showSection(cameraArea);

  } catch (error) {
    stopCamera();

    let mensagem = "Não foi possível abrir a câmera.";

    if (
      error.name === "NotAllowedError" ||
      error.name === "PermissionDeniedError"
    ) {
      mensagem = "A permissão da câmera foi bloqueada. Acesse as configurações do navegador e permita o uso da câmera.";
    } else if (error.name === "NotFoundError") {
      mensagem = "Nenhuma câmera compatível foi encontrada.";
    } else if (error.name === "NotReadableError") {
      mensagem = "A câmera está sendo usada por outro aplicativo. Feche os outros aplicativos que utilizam a câmera.";
    }

    alert(mensagem);
    console.error("Erro ao abrir câmera:", error);
  }
}

/* TROCAR CÂMERA */

async function switchCamera() {
  facingMode =
    facingMode === "environment" ? "user" : "environment";

  await openCamera();
}

/* ABRIR GALERIA */

function openGallery() {
  document.getElementById("gallery").click();
}

/* AJUSTAR FOTO PARA 9:16 */

function drawCover(source) {
  const sw = source.videoWidth || source.naturalWidth;
  const sh = source.videoHeight || source.naturalHeight;

  const width = 1080;
  const height = 1920;

  const scale = Math.max(width / sw, height / sh);

  const cropWidth = width / scale;
  const cropHeight = height / scale;

  const sx = (sw - cropWidth) / 2;
  const sy = (sh - cropHeight) / 2;

  ctx.drawImage(
    source,
    sx,
    sy,
    cropWidth,
    cropHeight,
    0,
    0,
    width,
    height
  );
}

/* DESENHAR NOMES NA FOTO FINAL */

async function drawNamesOnPhoto() {

  await document.fonts.ready;

  const cameraHeight = cameraArea.clientHeight || window.innerHeight;
  const scale = canvas.height / cameraHeight;

  const namesElement = document.getElementById("cameraNames");
  const style = getComputedStyle(namesElement);

  const bottom = parseFloat(style.bottom) || 145;
  const fontSize = parseFloat(style.fontSize) || 30;
  const fontFamily = style.fontFamily;
  const color = style.color;

  ctx.save();

  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";

  ctx.fillStyle = color;
  ctx.font = `${fontSize * scale}px ${fontFamily}`;

  ctx.shadowColor = "rgba(0,0,0,0.35)";
  ctx.shadowBlur = 5 * scale;
  ctx.shadowOffsetY = 1 * scale;

  ctx.fillText(
    namesElement.textContent.trim(),
    canvas.width / 2,
    canvas.height - (bottom * scale) - (5 * scale)
  );

  ctx.restore();
}

/* APLICAR MOLDURA E NOMES */

function applyFrame(source, cleanup) {
  const frameImage = new Image();

  frameImage.onload = async function() {

    canvas.width = 1080;
    canvas.height = 1920;

    drawCover(source);

    ctx.drawImage(frameImage, 0, 0, 1080, 1920);

    await drawNamesOnPhoto();

    if (cleanup) cleanup();

    stopCamera();
    showSection(resultArea);
  };

  frameImage.onerror = function() {
    if (cleanup) cleanup();

    alert("Não foi possível carregar moldura.png. Confira o arquivo no GitHub.");
  };

  frameImage.src = "moldura.png";
}

/* TIRAR FOTO */

function takePhoto() {
  if (!video.videoWidth) {
    alert("Aguarde a câmera iniciar.");
    return;
  }

  applyFrame(video);
}

/* ESCOLHER FOTO DA GALERIA */

document.getElementById("gallery").addEventListener(
  "change",
  function(event) {

    const file = event.target.files[0];

    if (!file) return;

    const image = new Image();
    const imageURL = URL.createObjectURL(file);

    image.onload = function() {
      applyFrame(image, function() {
        URL.revokeObjectURL(imageURL);
      });
    };

    image.onerror = function() {
      URL.revokeObjectURL(imageURL);
      alert("Não foi possível abrir essa fotografia.");
    };

    image.src = imageURL;
    event.target.value = "";
  }
);

/* BAIXAR FOTO */

function downloadPhoto() {
  canvas.toBlob(function(blob) {

    if (!blob) {
      alert("Não foi possível gerar a foto.");
      return;
    }

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "lembranca-mariana-e-rodrigo.png";

    link.click();

    setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 1000);

  }, "image/png");
}

/* VOLTAR À CAPA */

function goHome() {
  stopCamera();
  showSection(home);
}

</script>

</body>
</html>
