
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<!-- 🟨 ALTERE AQUI: NOME DA PÁGINA -->
<title>Cabine de Fotos</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000000;
  font-family: Arial, sans-serif;
}

:root {
  /* 🟨 ALTERE AQUI: CORES DOS BOTÕES DA CÂMERA */
  --camera-button-color: #ffffff;
  --camera-label-color: #ffffff;
  --camera-button-background: rgba(255,255,255,0.18);

  /* 🟨 ALTERE AQUI: CORES DOS BOTÕES DE RESULTADO */
  --result-button-background: #ffffff;
  --result-button-text: #333333;
  --result-button-border: #dddddd;

  /* 🟨 ALTERE AQUI: CORES DOS MODOS FOTO E VÍDEO */
  --mode-selected-background: #ffffff;
  --mode-selected-text: #222222;
  --mode-unselected-text: #ffffff;

  /* 🟨 ALTERE AQUI: FUNDO DA TELA DE RESULTADO */
  --result-background: #ffffff;

  /* 🟨 ALTERE AQUI: TAMANHO DAS LEGENDAS */
  --camera-label-size: 10px;

  /* 🟨 ALTERE AQUI: FONTE DOS BOTÕES */
  --button-font: Arial, sans-serif;
}

/* CÂMERA */

#cameraArea {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

#video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
  z-index: 3;
}

/* MODOS FOTO E VÍDEO */

.mode-selector {
  position: absolute;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
  padding: 5px;
  border-radius: 30px;
  background: rgba(0,0,0,0.4);
  z-index: 7;
}

.mode-button {
  border: none;
  border-radius: 25px;
  padding: 10px 20px;
  background: transparent;
  color: var(--mode-unselected-text);
  font-size: 11px;
  letter-spacing: 1px;
  font-family: var(--button-font);
  cursor: pointer;
}

.mode-button.active {
  background: var(--mode-selected-background);
  color: var(--mode-selected-text);
}

/* INDICADOR DE GRAVAÇÃO */

#recordingIndicator {
  display: none;
  position: absolute;
  top: 85px;
  left: 50%;
  transform: translateX(-50%);
  align-items: center;
  gap: 8px;
  color: white;
  font-size: 13px;
  z-index: 7;
  background: rgba(0,0,0,0.5);
  padding: 8px 13px;
  border-radius: 20px;
}

.recording-dot {
  width: 9px;
  height: 9px;
  background: #ff3333;
  border-radius: 50%;
}

/* CONTROLES DA CÂMERA */

.camera-controls {
  position: absolute;
  bottom: 28px;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 32px;
  z-index: 6;
}

.camera-control {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  border: none;
  background: transparent;
  color: var(--camera-label-color);
  font-family: var(--button-font);
  font-size: var(--camera-label-size);
  cursor: pointer;
  min-width: 65px;
}

.round-button {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid var(--camera-button-color);
  background: var(--camera-button-background);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--camera-button-color);
  font-size: 20px;
}

.capture-button .round-button {
  width: 66px;
  height: 66px;
  border: 4px solid var(--camera-button-color);
  background: var(--camera-button-background);
  position: relative;
}

.capture-button .round-button::after {
  content: "";
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  background: var(--camera-button-color);
}

.capture-button.recording .round-button::after {
  inset: 17px;
  border-radius: 5px;
  background: #ff3333;
}

/* RESULTADO */

#resultArea {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 15px;
  background: var(--result-background);
  z-index: 10;
  overflow-y: auto;
}

#photoCanvas,
#videoResult {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: calc(100% - 100px);
  object-fit: contain;
}

#videoResult {
  display: none;
  background: #000;
}

/* BOTÕES ABAIXO DA FOTO OU VÍDEO */

.result-buttons {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex-wrap: nowrap;
  gap: 7px;
  width: 100%;
  margin-top: 15px;
}

.result-button {
  border: 1px solid var(--result-button-border);
  border-radius: 20px;
  padding: 10px 11px;
  background: var(--result-button-background);
  color: var(--result-button-text);
  font-family: var(--button-font);
  font-size: 8px;
  letter-spacing: 0.3px;
  white-space: nowrap;
  cursor: pointer;
}

/* MENSAGEM DE ERRO */

#message {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 350px;
  padding: 12px;
  border-radius: 8px;
  background: rgba(0,0,0,0.85);
  color: white;
  font-size: 13px;
  text-align: center;
  display: none;
  z-index: 20;
}

@media (max-width: 360px) {
  .result-buttons {
    gap: 4px;
  }

  .result-button {
    padding: 9px 7px;
    font-size: 7px;
  }

  .camera-controls {
    gap: 20px;
  }

  .mode-button {
    padding: 9px 16px;
  }
}
</style>
</head>

<body>

<!-- CÂMERA -->

<section id="cameraArea">

  <video id="video" autoplay playsinline muted></video>

  <!-- 🟨 ALTERE AQUI: NOME DO ARQUIVO DA MOLDURA -->
  <img id="frame" src="moldura.png" alt="Moldura personalizada">

  <div class="mode-selector">

    <button
      class="mode-button active"
      id="photoModeButton"
      onclick="setMode('photo')">
      FOTO
    </button>

    <button
      class="mode-button"
      id="videoModeButton"
      onclick="setMode('video')">
      VÍDEO
    </button>

  </div>

  <div id="recordingIndicator">
    <span class="recording-dot"></span>
    <span id="recordingTime">00:00</span>
  </div>

  <div class="camera-controls">

    <button class="camera-control" onclick="openGallery()">
      <span class="round-button">▧</span>
      <span>GALERIA</span>
    </button>

    <button
      class="camera-control capture-button"
      id="captureButton"
      onclick="captureAction()">

      <span class="round-button"></span>
      <span id="captureLabel">FOTOGRAFAR</span>

    </button>

    <button class="camera-control" onclick="switchCamera()">
      <span class="round-button">↻</span>
      <span>TROCAR CÂMERA</span>
    </button>

  </div>

  <input
    type="file"
    id="galleryInput"
    accept="image/*"
    hidden>

</section>

<!-- RESULTADO -->

<section id="resultArea">

  <canvas
    id="photoCanvas"
    width="1080"
    height="1920">
  </canvas>

  <video
    id="videoResult"
    controls
    playsinline>
  </video>

  <div class="result-buttons">

    <button
      class="result-button"
      id="saveButton"
      onclick="saveResult()">
      SALVAR MINHA FOTO
    </button>

    <button
      class="result-button"
      onclick="backToCamera()">
      VOLTAR AO INÍCIO
    </button>

    <button
      class="result-button"
      id="againButton"
      onclick="takeAgain()">
      TIRAR OUTRA FOTO
    </button>

  </div>

</section>

<div id="message"></div>

<script>

/* ==================================================
   🟨 ÁREA DE PERSONALIZAÇÃO
   ALTERE SOMENTE OS CAMPOS INDICADOS
================================================== */

const CONFIG = {

  // 🟨 NOME DO EVENTO
  eventName: "Cabine de Fotos",

  // 🟨 NOME DO ARQUIVO DA MOLDURA
  frameFile: "moldura.png",

  // 🟨 NOME DO ARQUIVO DA FOTO SALVA
  photoFileName: "minha-foto-com-moldura.png",

  // 🟨 NOME DO ARQUIVO DO VÍDEO SALVO
  videoFileName: "meu-video-com-moldura",

  // 🟨 TEXTO DOS BOTÕES DA CÂMERA
  galleryLabel: "GALERIA",
  photoLabel: "FOTOGRAFAR",
  videoLabel: "GRAVAR VÍDEO",
  switchCameraLabel: "TROCAR CÂMERA",

  // 🟨 TEXTO DOS MODOS
  photoModeLabel: "FOTO",
  videoModeLabel: "VÍDEO",

  // 🟨 TEXTO DOS BOTÕES DE RESULTADO
  savePhotoLabel: "SALVAR MINHA FOTO",
  saveVideoLabel: "SALVAR MEU VÍDEO",
  homeLabel: "VOLTAR AO INÍCIO",
  againPhotoLabel: "TIRAR OUTRA FOTO",
  againVideoLabel: "GRAVAR OUTRO VÍDEO",

  // 🟨 CÂMERA INICIAL
  // environment = traseira
  // user = frontal
  initialCamera: "environment",

  // 🟨 QUALIDADE DA GRAVAÇÃO
  videoWidth: 1080,
  videoHeight: 1920,
  videoFPS: 30

};

/* FIM DA ÁREA DE PERSONALIZAÇÃO */

/* ELEMENTOS */

const cameraArea = document.getElementById("cameraArea");
const resultArea = document.getElementById("resultArea");

const video = document.getElementById("video");
const frame = document.getElementById("frame");

const canvas = document.getElementById("photoCanvas");
const ctx = canvas.getContext("2d");

const galleryInput = document.getElementById("galleryInput");
const videoResult = document.getElementById("videoResult");

const captureButton = document.getElementById("captureButton");
const captureLabel = document.getElementById("captureLabel");

const recordingIndicator = document.getElementById("recordingIndicator");
const recordingTime = document.getElementById("recordingTime");

const photoModeButton = document.getElementById("photoModeButton");
const videoModeButton = document.getElementById("videoModeButton");

const saveButton = document.getElementById("saveButton");
const againButton = document.getElementById("againButton");

let stream = null;
let facingMode = CONFIG.initialCamera;
let currentMode = "photo";

let currentPhoto = null;
let currentVideoUrl = null;

let mediaRecorder = null;
let recordedChunks = [];
let recordingStartedAt = 0;
let recordingTimer = null;
let animationFrame = null;
let canvasStream = null;
let recordingMimeType = "";

/* APLICA PERSONALIZAÇÕES */

document.title = CONFIG.eventName;

frame.src = CONFIG.frameFile;

photoModeButton.textContent = CONFIG.photoModeLabel;
videoModeButton.textContent = CONFIG.videoModeLabel;

document.querySelector(".camera-controls button:first-child span:last-child").textContent =
  CONFIG.galleryLabel;

document.querySelector(".camera-controls button:last-child span:last-child").textContent =
  CONFIG.switchCameraLabel;

saveButton.textContent = CONFIG.savePhotoLabel;
againButton.textContent = CONFIG.againPhotoLabel;

document.querySelector("#resultArea .result-buttons button:nth-child(2)").textContent =
  CONFIG.homeLabel;

/* MENSAGENS */

function showMessage(text) {
  const message = document.getElementById("message");

  message.textContent = text;
  message.style.display = "block";

  setTimeout(() => {
    message.style.display = "none";
  }, 4500);
}

/* MODOS FOTO E VÍDEO */

function setMode(mode) {

  if (mediaRecorder && mediaRecorder.state === "recording") {
    showMessage("Encerre a gravação antes de trocar de modo.");
    return;
  }

  currentMode = mode;

  photoModeButton.classList.toggle("active", mode === "photo");
  videoModeButton.classList.toggle("active", mode === "video");

  captureLabel.textContent =
    mode === "photo"
      ? CONFIG.photoLabel
      : CONFIG.videoLabel;
}

/* ABRIR CÂMERA */

async function openCamera() {

  stopCamera();

  resultArea.style.display = "none";
  cameraArea.style.display = "block";

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    showMessage("Seu navegador não permite acessar a câmera. Use uma conexão HTTPS.");
    return;
  }

  try {

    stream = await navigator.mediaDevices.getUserMedia({

      audio: true,

      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: CONFIG.videoWidth },
        height: { ideal: CONFIG.videoHeight }
      }

    });

    video.srcObject = stream;

    await new Promise((resolve, reject) => {

      if (video.readyState >= 1) {
        resolve();
      } else {
        video.onloadedmetadata = resolve;
        video.onerror = reject;
      }

    });

    await video.play();

  } catch (error) {

    console.error(error);

    if (error.name === "NotAllowedError" ||
        error.name === "PermissionDeniedError") {

      showMessage("Permita o acesso à câmera e ao microfone nas configurações do navegador.");

    } else if (error.name === "NotReadableError") {

      showMessage("A câmera ou o microfone estão sendo usados por outro aplicativo.");

    } else {

      showMessage("Não foi possível abrir a câmera. Verifique as permissões e tente novamente.");

    }

  }
}

/* ENCERRAR CÂMERA */

function stopCamera() {

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.pause();
  video.srcObject = null;
}

/* TROCAR CÂMERA */

async function switchCamera() {

  if (mediaRecorder && mediaRecorder.state === "recording") {
    showMessage("Encerre a gravação antes de trocar a câmera.");
    return;
  }

  facingMode =
    facingMode === "environment"
      ? "user"
      : "environment";

  await openCamera();
}

/* FOTOGRAFAR OU GRAVAR */

function captureAction() {

  if (!video.srcObject || video.readyState < 2) {
    showMessage("Aguarde a câmera carregar.");
    return;
  }

  if (currentMode === "photo") {
    takePhoto();
  } else {
    toggleRecording();
  }
}

/* FOTO */

function takePhoto() {

  if (!frame.complete || !frame.naturalWidth) {
    showMessage("Aguarde a moldura carregar.");
    return;
  }

  drawCover(video);

  currentPhoto = canvas.toDataURL("image/png");

  currentVideoUrl = null;

  showPhotoResult();
}

/* ENQUADRAMENTO 9:16 */

function drawCover(source) {

  const sourceWidth =
    source.videoWidth || source.naturalWidth;

  const sourceHeight =
    source.videoHeight || source.naturalHeight;

  if (!sourceWidth || !sourceHeight) return;

  const targetRatio = 1080 / 1920;
  const sourceRatio = sourceWidth / sourceHeight;

  let sx = 0;
  let sy = 0;
  let sw = sourceWidth;
  let sh = sourceHeight;

  if (sourceRatio > targetRatio) {

    sw = sourceHeight * targetRatio;
    sx = (sourceWidth - sw) / 2;

  } else {

    sh = sourceWidth / targetRatio;
    sy = (sourceHeight - sh) / 2;

  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.drawImage(
    source,
    sx, sy, sw, sh,
    0, 0, canvas.width, canvas.height
  );

  ctx.drawImage(
    frame,
    0, 0,
    canvas.width,
    canvas.height
  );

}

/* MOSTRAR FOTO */

function showPhotoResult() {

  stopCamera();

  videoResult.pause();
  videoResult.style.display = "none";

  canvas.style.display = "block";

  saveButton.textContent = CONFIG.savePhotoLabel;
  againButton.textContent = CONFIG.againPhotoLabel;

  cameraArea.style.display = "none";
  resultArea.style.display = "flex";
}

/* INICIAR OU ENCERRAR GRAVAÇÃO */

function toggleRecording() {

  if (mediaRecorder &&
      mediaRecorder.state === "recording") {

    mediaRecorder.stop();

  } else {

    startRecording();

  }

}

/* FORMATOS DE VÍDEO SUPORTADOS */

function getSupportedMimeType() {

  const types = [
    "video/mp4;codecs=h264,aac",
    "video/mp4",
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];

  for (const type of types) {

    if (MediaRecorder.isTypeSupported(type)) {
      return type;
    }

  }

  return "";

}

/* INICIAR GRAVAÇÃO */

function startRecording() {

  if (!frame.complete || !frame.naturalWidth) {
    showMessage("Aguarde a moldura carregar.");
    return;
  }

  if (!window.MediaRecorder ||
      !canvas.captureStream) {

    showMessage("Seu navegador não oferece suporte à gravação com moldura.");
    return;
  }

  try {

    recordedChunks = [];

    drawCover(video);

    canvasStream = canvas.captureStream(CONFIG.videoFPS);

    /* ADICIONAR ÁUDIO DO MICROFONE */

    const audioTracks = stream.getAudioTracks();

    audioTracks.forEach(track => {
      canvasStream.addTrack(track);
    });

    recordingMimeType = getSupportedMimeType();

    const options = recordingMimeType
      ? { mimeType: recordingMimeType }
      : {};

    mediaRecorder = new MediaRecorder(
      canvasStream,
      options
    );

    mediaRecorder.ondataavailable = function(event) {

      if (event.data && event.data.size > 0) {
        recordedChunks.push(event.data);
      }

    };

    mediaRecorder.onstop = finishRecording;

    mediaRecorder.onerror = function() {

      showMessage("Ocorreu um erro durante a gravação.");
      cleanupRecording();

    };

    mediaRecorder.start(1000);

    recordingStartedAt = Date.now();

    recordingIndicator.style.display = "flex";

    captureButton.classList.add("recording");

    captureLabel.textContent = "ENCERRAR";

    recordingTimer = setInterval(
      updateRecordingTime,
      500
    );

    /* DESENHAR A MOLDURA DURANTE O VÍDEO */

    function renderFrame() {

      if (!mediaRecorder ||
          mediaRecorder.state !== "recording") {
        return;
      }

      drawCover(video);

      animationFrame =
        requestAnimationFrame(renderFrame);

    }

    animationFrame =
      requestAnimationFrame(renderFrame);

  } catch (error) {

    console.error(error);

    showMessage("Não foi possível iniciar a gravação.");

    cleanupRecording();

  }

}

/* CRONÔMETRO */

function updateRecordingTime() {

  const seconds = Math.floor(
    (Date.now() - recordingStartedAt) / 1000
  );

  const minutesText = String(
    Math.floor(seconds / 60)
  ).padStart(2, "0");

  const secondsText = String(
    seconds % 60
  ).padStart(2, "0");

  recordingTime.textContent =
    minutesText + ":" + secondsText;

}

/* FINALIZAR VÍDEO */

function finishRecording() {

  cleanupRecording();

  if (!recordedChunks.length) {
    showMessage("Não foi possível gerar o vídeo.");
    return;
  }

  const mimeType =
    recordingMimeType || "video/webm";

  const videoBlob = new Blob(
    recordedChunks,
    { type: mimeType }
  );

  if (currentVideoUrl) {
    URL.revokeObjectURL(currentVideoUrl);
  }

  currentVideoUrl = URL.createObjectURL(videoBlob);

  currentPhoto = null;

  videoResult.src = currentVideoUrl;
  videoResult.style.display = "block";

  canvas.style.display = "none";

  saveButton.textContent = CONFIG.saveVideoLabel;
  againButton.textContent = CONFIG.againVideoLabel;

  stopCamera();

  cameraArea.style.display = "none";
  resultArea.style.display = "flex";

  videoResult.load();

}

/* LIMPAR GRAVAÇÃO */

function cleanupRecording() {

  if (recordingTimer) {

    clearInterval(recordingTimer);
    recordingTimer = null;

  }

  if (animationFrame) {

    cancelAnimationFrame(animationFrame);
    animationFrame = null;

  }

  if (canvasStream) {

    canvasStream.getTracks().forEach(
      track => track.stop()
    );

    canvasStream = null;

  }

  recordingIndicator.style.display = "none";

  captureButton.classList.remove("recording");

  captureLabel.textContent =
    currentMode === "photo"
      ? CONFIG.photoLabel
      : CONFIG.videoLabel;

}

/* GALERIA DE FOTOS */

function openGallery() {

  if (currentMode === "video") {

    showMessage("A galeria está disponível para fotos. Para vídeos, use a câmera.");

    return;
  }

  galleryInput.click();

}

galleryInput.addEventListener("change", function(event) {

  const file = event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {

    showMessage("Selecione uma foto para aplicar a moldura.");

    galleryInput.value = "";

    return;
  }

  const objectUrl = URL.createObjectURL(file);

  const image = new Image();

  image.onload = function() {

    drawCover(image);

    currentPhoto = canvas.toDataURL("image/png");
    currentVideoUrl = null;

    URL.revokeObjectURL(objectUrl);

    galleryInput.value = "";

    showPhotoResult();

  };

  image.onerror = function() {

    showMessage("Não foi possível abrir essa imagem.");

    URL.revokeObjectURL(objectUrl);

    galleryInput.value = "";

  };

  image.src = objectUrl;

});

/* SALVAR FOTO OU VÍDEO */

function saveResult() {

  let url;
  let filename;

  if (currentVideoUrl) {

    url = currentVideoUrl;

    const extension =
      recordingMimeType.includes("mp4")
        ? "mp4"
        : "webm";

    filename =
      CONFIG.videoFileName + "." + extension;

  } else if (currentPhoto) {

    url = currentPhoto;
    filename = CONFIG.photoFileName;

  } else {

    showMessage("Nenhum arquivo disponível para salvar.");
    return;

  }

  const link = document.createElement("a");

  link.href = url;
  link.download = filename;

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

}

/* VOLTAR À CÂMERA */

function backToCamera() {

  videoResult.pause();

  if (currentVideoUrl) {

    URL.revokeObjectURL(currentVideoUrl);
    currentVideoUrl = null;

  }

  currentPhoto = null;

  openCamera();

}

/* TIRAR OUTRA FOTO OU GRAVAR OUTRO VÍDEO */

function takeAgain() {

  backToCamera();

}

/* ENCERRAR RECURSOS AO SAIR DA PÁGINA */

window.addEventListener("pagehide", function() {

  stopCamera();

  if (currentVideoUrl) {
    URL.revokeObjectURL(currentVideoUrl);
  }

});

/* INICIAR DIRETAMENTE NA CÂMERA */

openCamera();

</script>

</body>
</html>
